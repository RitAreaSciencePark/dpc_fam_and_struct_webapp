apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-cnpg-operator-status
  namespace: dpcdom
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: dpcexplorer-postgresql
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: REPLACE_WITH_OPERATOR_NAMESPACE
      ports:
        - protocol: TCP
          port: 8000
