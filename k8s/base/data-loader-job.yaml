apiVersion: batch/v1
kind: Job
metadata:
  name: dpcexplorer-data-loader
spec:
  suspend: true
  backoffLimit: 1
  activeDeadlineSeconds: 43200
  ttlSecondsAfterFinished: 86400

  template:
    metadata:
      labels:
        app.kubernetes.io/name: dpcexplorer
        app.kubernetes.io/component: data-loader

    spec:
      restartPolicy: Never
      automountServiceAccountToken: false

      imagePullSecrets:
        - name: dpcexplorer-ghcr-pull

      terminationGracePeriodSeconds: 30

      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: data-loader
          image: ghcr.io/ritareasciencepark/dpc_fam_and_struct_webapp-data-loader:replace-me
          imagePullPolicy: IfNotPresent

          env:
            - name: HOME
              value: /tmp

          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          volumeMounts:
            - name: biological-data
              mountPath: /data

            - name: temporary-files
              mountPath: /tmp

      volumes:
        - name: biological-data
          persistentVolumeClaim:
            claimName: dpcexplorer-data

        - name: temporary-files
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
