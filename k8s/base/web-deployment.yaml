apiVersion: apps/v1
kind: Deployment
metadata:
  name: dpcexplorer-web
spec:
  replicas: 1

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app.kubernetes.io/name: dpcexplorer
      app.kubernetes.io/component: web

  template:
    metadata:
      labels:
        app.kubernetes.io/name: dpcexplorer
        app.kubernetes.io/component: web

    spec:
      automountServiceAccountToken: false

      imagePullSecrets:
        - name: dpcexplorer-ghcr-pull

      terminationGracePeriodSeconds: 30

      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: web
          image: ghcr.io/ritareasciencepark/dpc_fam_and_struct_webapp:replace-me
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8000
              protocol: TCP

          envFrom:
            - configMapRef:
                name: dpcexplorer-config

          env:
            - name: DJANGO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: dpcexplorer-django
                  key: secret-key

            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: dpcexplorer-postgresql-app
                  key: username

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dpcexplorer-postgresql-app
                  key: password

          startupProbe:
            httpGet:
              path: /health/live
              port: http
              httpHeaders:
                - name: Host
                  value: localhost
            periodSeconds: 2
            failureThreshold: 30

          livenessProbe:
            httpGet:
              path: /health/live
              port: http
              httpHeaders:
                - name: Host
                  value: localhost
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
              httpHeaders:
                - name: Host
                  value: localhost
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          volumeMounts:
            - name: biological-data
              mountPath: /data
              readOnly: true

            - name: temporary-files
              mountPath: /tmp

      volumes:
        - name: biological-data
          persistentVolumeClaim:
            claimName: dpcexplorer-data

        - name: temporary-files
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
