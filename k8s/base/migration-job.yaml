apiVersion: batch/v1
kind: Job
metadata:
  name: dpcexplorer-migrate
spec:
  suspend: true
  backoffLimit: 2
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 86400

  template:
    metadata:
      labels:
        app.kubernetes.io/name: dpcexplorer
        app.kubernetes.io/component: migration

    spec:
      restartPolicy: Never
      automountServiceAccountToken: false

      imagePullSecrets:
        - name: dpcexplorer-ghcr-pull

      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: migrate
          image: ghcr.io/ritareasciencepark/dpc_fam_and_struct_webapp:replace-me
          imagePullPolicy: IfNotPresent

          command:
            - python
            - manage.py
            - migrate
            - --noinput

          envFrom:
            - configMapRef:
                name: dpcexplorer-config

          env:
            - name: DJANGO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: dpcexplorer-django
                  key: secret-key

            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: dpcexplorer-postgresql-app
                  key: username

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dpcexplorer-postgresql-app
                  key: password

          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          volumeMounts:
            - name: temporary-files
              mountPath: /tmp

      volumes:
        - name: temporary-files
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
